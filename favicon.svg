<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="#080601"/>

  <!-- Scribbled > — drawn like a quick pen stroke, slightly wobbly -->
  <path d="M 16 20 Q 22 28 54 50 Q 24 70 15 80"
        fill="none" stroke="#c9972a" stroke-width="8"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Second lighter ghost pass — like pressing a pen twice -->
  <path d="M 17 21 Q 24 32 52 51 Q 26 69 16 79"
        fill="none" stroke="#c9972a" stroke-width="2.5"
        stroke-linecap="round" opacity="0.3"/>

  <!-- Scribbled _ cursor — slightly slanted, not perfectly horizontal -->
  <path d="M 61 77 Q 72 74 84 78"
        fill="none" stroke="#c9972a" stroke-width="8"
        stroke-linecap="round"/>

  <!-- Tiny blink mark above cursor — like a terminal cursor block -->
  <rect x="62" y="56" width="18" height="13" fill="#c9972a" opacity="0.15" rx="1"/>
</svg>
